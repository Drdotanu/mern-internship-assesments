<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color:#f0f0f0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:450px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        fieldset{
            padding:20px;
            border:1px solid black;
        }

        legend{
            font-size:24px;
            font-weight:bold;
            padding:0 10px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-size:18px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        .gender{
            margin-top:10px;
        }

        .gender input{
            margin-left:10px;
        }

        textarea{
            resize:none;
        }

        button{
            margin-top:20px;
            padding:10px 20px;
            font-size:18px;
            background-color:#4CAF50;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background-color:#45a049;
        }

    </style>
</head>

<body>

    <div class="container">

        <form>

            <fieldset>

                <legend>User personal information</legend>

                <label>Enter your full name</label>
                <input type="text" placeholder="Rahul Kumar">

                <label>Enter your email</label>
                <input type="email" placeholder="geeks@12345gmail.com">

                <label>Enter your password</label>
                <input type="password">

                <label>Confirm your password</label>
                <input type="password">

                <label>Enter your gender</label>

                <div class="gender">
                    <input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female
                    <input type="radio" name="gender">Others
                </div>

                <label>Enter your Date of Birth</label>
                <input type="date">

                <label>Enter your Address:</label>
                <textarea rows="4" placeholder="Noida Sector 137"></textarea>

                <button type="submit">Submit</button>

            </fieldset>

        </form>

    </div>

</body>
</html>
